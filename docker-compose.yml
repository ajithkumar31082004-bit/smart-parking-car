services:
  # --- Smart Parking Application ---
  smartpark-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: smartpark_ai_service
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - JWT_SECRET=smartpark_production_super_jwt_secret_2026
      - DB_PATH=/app/database/smartpark.db
    volumes:
      - smartpark_data:/app/database
    networks:
      - smartpark-network

  # --- Nginx Reverse Proxy ---
  nginx:
    image: nginx:alpine
    container_name: smartpark_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - nginx_logs:/var/log/nginx
    depends_on:
      - smartpark-app
    networks:
      - smartpark-network

networks:
  smartpark-network:
    driver: bridge

volumes:
  smartpark_data:
    driver: local
  nginx_logs:
    driver: local
