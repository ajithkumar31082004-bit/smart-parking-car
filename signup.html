<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Customer Account | SmartPark AI Platform</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap">
    <link rel="stylesheet" href="/frontend/css/styles.css">
    <style>
        .auth-card {
            background: var(--bg-surface);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            padding: 2.5rem;
            max-width: 520px;
            margin: 2rem auto;
            box-shadow: var(--shadow-lg);
        }
    </style>
</head>
<body>
    <!-- Header -->
    <header class="app-header">
        <div class="header-container">
            <a href="/index.html" class="brand-logo">
                <i class="fas fa-car-side"></i>
                <span>SmartPark<span style="color:var(--text-main)">AI</span></span>
            </a>
            <nav class="nav-links" id="dynamic-nav-links"></nav>
            <div class="nav-actions">
                <button class="theme-btn" onclick="toggleTheme()" title="Toggle Theme"><i class="fas fa-moon theme-icon"></i></button>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="main-wrapper">
        <div class="auth-card">
            <div style="text-align: center; margin-bottom: 2rem;">
                <div style="width: 50px; height: 50px; background: var(--ev-green-light); color: var(--ev-green-dark); border-radius: var(--radius-md); display: inline-flex; align-items: center; justify-content: center; font-size: 1.5rem; margin-bottom: 0.75rem;">
                    <i class="fas fa-user-plus"></i>
                </div>
                <h1 style="font-size: 1.8rem; font-weight: 800;">Create Account</h1>
                <p style="color: var(--text-muted); font-size: 0.9rem;">Join SmartPark AI for instant contactless parking & EV reservations.</p>
            </div>

            <form id="signupForm" onsubmit="handleSignup(event)">
                <div class="form-group">
                    <label class="form-label">Full Name</label>
                    <input type="text" id="name" class="form-control" placeholder="e.g. Alex Johnson" required>
                </div>

                <div class="grid-2">
                    <div class="form-group">
                        <label class="form-label">Email Address</label>
                        <input type="email" id="email" class="form-control" placeholder="name@domain.com" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Phone Number</label>
                        <input type="tel" id="phone" class="form-control" placeholder="+91 98765 00000" required>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label">Password</label>
                    <input type="password" id="password" class="form-control" placeholder="Minimum 8 characters" required minlength="6">
                </div>

                <!-- Initial Vehicle Registration -->
                <div style="background:var(--bg-body); padding:1rem; border-radius:var(--radius-md); margin: 1.25rem 0;">
                    <span style="font-size:0.8rem; font-weight:700; color:var(--text-muted); text-transform:uppercase;">Primary Vehicle (Optional)</span>
                    <div class="grid-2" style="margin-top:0.5rem;">
                        <input type="text" id="vehPlate" class="form-control" placeholder="License Plate (e.g. TN-01-AB-1234)" style="text-transform:uppercase;">
                        <select id="vehType" class="form-control">
                            <option value="car">Car / Sedan</option>
                            <option value="suv">SUV</option>
                            <option value="bike">Bike</option>
                            <option value="ev">Electric Vehicle (EV)</option>
                        </select>
                    </div>
                </div>

                <button type="submit" id="signupBtn" class="btn btn-primary btn-lg" style="width: 100%;">
                    <i class="fas fa-arrow-right"></i> Register & Continue
                </button>
            </form>

            <div style="text-align: center; margin-top: 1.25rem; font-size: 0.9rem; color: var(--text-muted);">
                Already have an account? <a href="/login.html" style="font-weight: 600;">Sign in</a>
            </div>
        </div>
    </main>

    <!-- Scripts -->
    <script src="/frontend/js/theme.js"></script>
    <script src="/frontend/js/api.js"></script>
    <script src="/frontend/js/auth.js"></script>
    <script>
        async function handleSignup(e) {
            e.preventDefault();
            const btn = document.getElementById('signupBtn');
            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Creating Account...';

            const payload = {
                name: document.getElementById('name').value.trim(),
                email: document.getElementById('email').value.trim(),
                phone: document.getElementById('phone').value.trim(),
                password: document.getElementById('password').value,
                vehicleNumber: document.getElementById('vehPlate').value.trim().toUpperCase(),
                vehicleType: document.getElementById('vehType').value,
                isEv: document.getElementById('vehType').value === 'ev'
            };

            try {
                const res = await API.register(payload);
                if (res && res.token) {
                    Auth.login(res.token, res.user);
                    API.toast('Registration successful! Welcome to SmartPark AI.', 'success');
                    setTimeout(() => window.location.href = '/dashboard.html', 800);
                }
            } catch (err) {
                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-arrow-right"></i> Register & Continue';
            }
        }
    </script>
</body>
</html>
