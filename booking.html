<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Parking | SmartPark AI</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #2563eb;
            --primary-dark: #1e40af;
            --ev-green: #10b981;
            --danger: #ef4444;
            --dark: #1f2937;
            --light: #f9fafb;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', system-ui, sans-serif;
        }
        body {
            background-color: #f3f4f6;
            color: var(--dark);
            line-height: 1.6;
        }
        header {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: white;
            padding: 1rem 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        .logo {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 1.5rem;
            font-weight: 700;
        }
        .logo i {
            color: var(--ev-green);
        }
        nav {
            display: flex;
            gap: 1.5rem;
        }
        nav a {
            color: white;
            text-decoration: none;
            font-weight: 500;
            transition: all 0.3s ease;
        }
        nav a:hover {
            color: #93c5fd;
        }
        .container {
            max-width: 600px;
            margin: 2rem auto;
            padding: 2rem;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
        }
        h1 {
            color: var(--primary);
            margin-bottom: 1.5rem;
            text-align: center;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }
        .booking-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid #e5e7eb;
        }
        .slot-display {
            background: var(--light);
            padding: 0.5rem 1rem;
            border-radius: 8px;
            font-weight: 600;
            color: var(--primary-dark);
        }
        .ev-tag {
            background: var(--ev-green);
            color: white;
            padding: 0.25rem 0.5rem;
            border-radius: 20px;
            font-size: 0.8rem;
            display: inline-flex;
            align-items: center;
            gap: 0.25rem;
            margin-left: 0.5rem;
        }
        label {
            display: block;
            margin: 1rem 0 0.5rem;
            font-weight: 500;
            color: var(--dark);
        }
        input, select {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid #e5e7eb;
            border-radius: 8px;
            font-size: 1rem;
            transition: all 0.2s;
        }
        input:focus, select:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }
        .form-section {
            display: none;
            margin-top: 1.5rem;
            padding: 1.5rem;
            background: var(--light);
            border-radius: 8px;
            border-left: 4px solid var(--primary);
        }
        .active-section {
            display: block;
        }
        button {
            width: 100%;
            padding: 1rem;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            margin-top: 2rem;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }
        button:hover {
            background: var(--primary-dark);
        }
        .price-display {
            margin-top: 1.5rem;
            padding: 1rem;
            background: var(--light);
            border-radius: 8px;
        }
        .price-row {
            display: flex;
            justify-content: space-between;
            margin: 0.5rem 0;
        }
        .total-row {
            font-weight: 700;
            border-top: 1px solid #e5e7eb;
            padding-top: 0.5rem;
            margin-top: 0.5rem;
        }
        .price {
            color: var(--primary);
            font-size: 1.2rem;
        }
        .ev-notice {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            background: rgba(16, 185, 129, 0.1);
            padding: 0.75rem;
            border-radius: 8px;
            margin-top: 1rem;
            color: var(--ev-green);
            font-size: 0.9rem;
        }
        .ev-charge-details {
            background: rgba(16, 185, 129, 0.05);
            border-left: 3px solid var(--ev-green);
            padding: 0.8rem;
            margin-top: 0.5rem;
            border-radius: 0 8px 8px 0;
        }
        .ev-charge-row {
            display: flex;
            justify-content: space-between;
            margin: 0.3rem 0;
            font-size: 0.9rem;
        }
        @media (max-width: 640px) {
            .container {
                margin: 1rem;
                padding: 1.5rem;
            }
            header {
                flex-direction: column;
                padding: 1rem;
            }
            nav {
                margin-top: 1rem;
                flex-wrap: wrap;
                justify-content: center;
            }
        }
    </style>
</head>
<body>
    <header>
        <div class="logo">
            <i class="fas fa-car"></i>
            <span>SmartPark AI</span>
        </div>
        <nav>
            <a href="index.html"><i class="fas fa-home"></i> Home</a>
            <a href="slots.html"><i class="fas fa-map-marker-alt"></i> Parking Slots</a>
            <a href="booking.html"><i class="fas fa-bookmark"></i> Book Now</a>
            <a href="login.html"><i class="fas fa-sign-in-alt"></i> Login</a>
        </nav>
    </header>

    <div class="container">
        <h1><i class="fas fa-parking"></i> Book Your Parking</h1>
        
        <div class="booking-header">
            <div>
                <h3>Selected Slot</h3>
                <div class="slot-display" id="selectedSlotDisplay">
                    Not selected
                </div>
            </div>
            <div id="slotTypeDisplay"></div>
        </div>

        <form id="bookingForm">
            <label for="name">Full Name</label>
            <input type="text" id="name" name="name" placeholder="Enter your full name" required>

            <label for="vehicle">Vehicle Number</label>
            <input type="text" id="vehicle" name="vehicle" placeholder="e.g., TN-01-AB-1234" required>

            <label for="bookingType">Booking Type</label>
            <select id="bookingType" name="bookingType" required>
                <option value="">-- Select Booking Type --</option>
                <option value="hour">Hourly Parking</option>
                <option value="day">Daily Parking</option>
            </select>

            <div id="hourSection" class="form-section">
                <label for="startTime">Start Time</label>
                <input type="time" id="startTime" name="startTime" required>

                <label for="endTime">End Time</label>
                <input type="time" id="endTime" name="endTime" required>
            </div>

            <div id="daySection" class="form-section">
                <label for="startDate">Start Date</label>
                <input type="date" id="startDate" name="startDate" required>

                <label for="endDate">End Date</label>
                <input type="date" id="endDate" name="endDate" required>
            </div>

            <div class="price-display">
                <div class="price-row">
                    <span>Base Parking:</span>
                    <span id="basePrice">₹0</span>
                </div>
                <div id="evChargeRow" class="price-row" style="display:none;">
                    <span>EV Charging:</span>
                    <span id="evCharge">₹0</span>
                </div>
                <div class="price-row total-row">
                    <span>Total Amount:</span>
                    <span class="price" id="totalPrice">₹0</span>
                </div>
            </div>

            <div id="evNotice" class="ev-notice" style="display: none;">
                <i class="fas fa-bolt"></i>
                <span>This is an EV charging slot. Additional charging fees apply.</span>
            </div>

            <button type="submit">
                <i class="fas fa-lock"></i> Confirm Booking & Get Gate Code
            </button>
        </form>
    </div>

    <script>
        // Get URL parameters
        const urlParams = new URLSearchParams(window.location.search);
        const slotParam = urlParams.get('slot');
        const typeParam = urlParams.get('type');

        // Update slot display
        if (slotParam) {
            document.getElementById('selectedSlotDisplay').textContent = `Slot ${slotParam}`;
            
            if (typeParam === 'ev') {
                document.getElementById('selectedSlotDisplay').innerHTML += 
                    `<span class="ev-tag"><i class="fas fa-bolt"></i> EV Charging</span>`;
                document.getElementById('evNotice').style.display = 'flex';
            }
        }

        // Show/hide booking sections
        document.getElementById('bookingType').addEventListener('change', function() {
            document.getElementById('hourSection').classList.remove('active-section');
            document.getElementById('daySection').classList.remove('active-section');
            
            if (this.value === 'hour') {
                document.getElementById('hourSection').classList.add('active-section');
            } else if (this.value === 'day') {
                document.getElementById('daySection').classList.add('active-section');
            }
            calculatePrice();
        });

        // Update price when inputs change
        document.querySelectorAll('#startTime, #endTime, #startDate, #endDate').forEach(
            element => element.addEventListener('change', calculatePrice)
        );

        // Calculate price function
        function calculatePrice() {
            const isEV = typeParam === 'ev';
            const bookingType = document.getElementById('bookingType').value;
            let basePrice = 0, evCharge = 0;

            if (bookingType === 'hour') {
                const startTime = document.getElementById('startTime').value;
                const endTime = document.getElementById('endTime').value;
                
                if (startTime && endTime) {
                    const start = new Date(`2000-01-01T${startTime}`);
                    const end = new Date(`2000-01-01T${endTime}`);
                    const hours = (end - start) / (1000 * 60 * 60);
                    
                    if (hours > 0) {
                        basePrice = Math.round(hours * 50);
                        if (isEV) {
                            evCharge = Math.round(hours * 20);
                            document.getElementById('evChargeRow').style.display = 'flex';
                        } else {
                            document.getElementById('evChargeRow').style.display = 'none';
                        }
                    }
                }
            } 
            else if (bookingType === 'day') {
                const startDate = document.getElementById('startDate').value;
                const endDate = document.getElementById('endDate').value;
                
                if (startDate && endDate) {
                    const start = new Date(startDate);
                    const end = new Date(endDate);
                    const days = ((end - start) / (1000 * 60 * 60 * 24)) + 1;
                    
                    if (days > 0) {
                        basePrice = days * 300;
                        if (isEV) {
                            evCharge = days * 100;
                            document.getElementById('evChargeRow').style.display = 'flex';
                        } else {
                            document.getElementById('evChargeRow').style.display = 'none';
                        }
                    }
                }
            }

            document.getElementById('basePrice').textContent = `₹${basePrice}`;
            document.getElementById('evCharge').textContent = `₹${evCharge}`;
            document.getElementById('totalPrice').textContent = `₹${basePrice + evCharge}`;
        }

        // Handle form submission
        document.getElementById('bookingForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            // Calculate final price
            let price = 0;
            let durationText = '';
            const bookingType = document.getElementById('bookingType').value;
            const isEV = typeParam === 'ev';
            
            if (bookingType === 'hour') {
                const startTime = document.getElementById('startTime').value;
                const endTime = document.getElementById('endTime').value;
                const start = new Date(`2000-01-01T${startTime}`);
                const end = new Date(`2000-01-01T${endTime}`);
                const diffHours = (end - start) / (1000 * 60 * 60);
                price = Math.round(diffHours * 50);
                durationText = `${startTime} to ${endTime}`;
                
                if (isEV) {
                    price += Math.round(diffHours * 20);
                }
            } else if (bookingType === 'day') {
                const startDate = document.getElementById('startDate').value;
                const endDate = document.getElementById('endDate').value;
                const start = new Date(startDate);
                const end = new Date(endDate);
                const diffDays = (end - start) / (1000 * 60 * 60 * 24) + 1;
                price = diffDays * 300;
                durationText = `${startDate} to ${endDate}`;
                
                if (isEV) {
                    price += diffDays * 100;
                }
            }

            const gateCode = Math.floor(100000 + Math.random() * 900000);
            const bookingData = {
                slot: slotParam || "Not specified",
                name: document.getElementById('name').value,
                vehicle: document.getElementById('vehicle').value,
                bookingType: bookingType,
                startTime: document.getElementById('startTime').value,
                endTime: document.getElementById('endTime').value,
                startDate: document.getElementById('startDate').value,
                endDate: document.getElementById('endDate').value,
                durationText: durationText,
                price: price,
                evCharge: isEV,
                gateCode: gateCode,
                type: typeParam || "normal"
            };

            // Store booking data in localStorage
            localStorage.setItem('bookingData', JSON.stringify(bookingData));
            window.location.href = 'bill.html';
        });

        // Initialize date fields with today's date
        const today = new Date().toISOString().split('T')[0];
        document.getElementById('startDate').value = today;
        document.getElementById('endDate').value = today;
    </script>
</body>
</html>
