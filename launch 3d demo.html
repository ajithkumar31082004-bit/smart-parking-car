<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>3D Smart Parking Simulation | SmartPark AI</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap">
    <link rel="stylesheet" href="/frontend/css/styles.css">
    <style>
        html, body {
            height: 100%;
            margin: 0;
            overflow: hidden;
            background: #0f172a;
        }
        #info {
            position: absolute;
            left: 20px;
            top: 80px;
            z-index: 100;
            background: var(--bg-surface);
            color: var(--text-main);
            padding: 18px 22px;
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-lg);
            max-width: 320px;
            border: 1px solid var(--border-color);
            backdrop-filter: blur(12px);
        }
        .stats {
            display: flex;
            gap: 10px;
            margin: 15px 0;
        }
        .stat-box {
            background: var(--bg-body);
            padding: 10px;
            border-radius: var(--radius-md);
            text-align: center;
            flex: 1;
            border: 1px solid var(--border-color);
        }
        .stat-value {
            font-weight: 800;
            font-size: 1.25rem;
            color: var(--primary);
        }
        .stat-label {
            font-size: 0.75rem;
            color: var(--text-muted);
            font-weight: 600;
        }
        .ev-badge-floating {
            position: absolute;
            right: 20px;
            top: 80px;
            z-index: 100;
            background: var(--ev-green);
            color: white;
            padding: 8px 16px;
            border-radius: var(--radius-full);
            font-size: 0.85rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 6px;
            box-shadow: var(--shadow-md);
        }
        #loading {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #0f172a;
            color: white;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 2000;
        }
        .loader {
            border: 4px solid rgba(255,255,255,0.1);
            border-top: 4px solid var(--primary);
            border-radius: 50%;
            width: 48px;
            height: 48px;
            animation: spin 1s linear infinite;
            margin-bottom: 16px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <!-- Header -->
    <header class="app-header" style="position:absolute; width:100%;">
        <div class="header-container">
            <a href="/index.html" class="brand-logo">
                <i class="fas fa-car-side"></i>
                <span>SmartPark<span style="color:var(--text-main)">AI</span></span>
            </a>
            <nav class="nav-links" id="dynamic-nav-links"></nav>
            <div class="nav-actions">
                <button class="theme-btn" onclick="toggleTheme()" title="Toggle Theme"><i class="fas fa-moon theme-icon"></i></button>
                <div id="nav-auth-actions"></div>
            </div>
        </div>
    </header>

    <div id="loading">
        <div class="loader"></div>
        <h3 style="font-weight: 700;">Rendering 3D Smart Parking Deck</h3>
        <p style="color: #94a3b8; font-size:0.9rem;">Connecting to real-time IoT digital twin...</p>
    </div>

    <div id="info">
        <h3 style="color:var(--primary); font-weight:800; display:flex; align-items:center; gap:0.5rem; margin-bottom:0.35rem;">
            <i class="fas fa-cube"></i> 3D Digital Twin
        </h3>
        <p style="font-size: 0.85rem; color: var(--text-muted); margin-bottom: 12px;">
            Click on any available spot to reserve. Green spaces indicate active EV Fast Charging stalls.
        </p>
        
        <div class="stats">
            <div class="stat-box">
                <div class="stat-value" id="available-slots" style="color:var(--ev-green);">20</div>
                <div class="stat-label">Available</div>
            </div>
            <div class="stat-box">
                <div class="stat-value" id="ev-slots" style="color:var(--accent);">10</div>
                <div class="stat-label">EV Fast Stalls</div>
            </div>
        </div>
        
        <div style="display:flex; gap:0.5rem;">
            <a href="/slots.html" class="btn btn-primary btn-sm" style="flex:1;">
                <i class="fas fa-th"></i> Slot Matrix
            </a>
            <button id="resetView" class="btn btn-secondary btn-sm">
                <i class="fas fa-sync-alt"></i> Reset Cam
            </button>
        </div>
    </div>

    <div class="ev-badge-floating">
        <i class="fas fa-bolt"></i> 50 kW EV Hub Active
    </div>

    <!-- Three.js & dependencies -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/renderers/CSS2DRenderer.js"></script>
    
    <script src="/frontend/js/theme.js"></script>
    <script src="/frontend/js/api.js"></script>
    <script src="/frontend/js/auth.js"></script>
    <script>
        // Initialize Three.js scene
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0b1120);
        scene.fog = new THREE.FogExp2(0x0b1120, 0.008);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 1, 1000);
        camera.position.set(0, 75, 120);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        document.body.appendChild(renderer.domElement);

        const labelRenderer = new THREE.CSS2DRenderer();
        labelRenderer.setSize(window.innerWidth, window.innerHeight);
        labelRenderer.domElement.style.position = 'absolute';
        labelRenderer.domElement.style.top = '0px';
        labelRenderer.domElement.style.pointerEvents = 'none';
        document.body.appendChild(labelRenderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.maxPolarAngle = Math.PI / 2.1;
        controls.minDistance = 30;
        controls.maxDistance = 200;

        // Lights
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(50, 100, 50);
        dirLight.castShadow = true;
        dirLight.shadow.mapSize.width = 2048;
        dirLight.shadow.mapSize.height = 2048;
        scene.add(dirLight);

        // Ground Plane
        const groundGeo = new THREE.PlaneGeometry(160, 140);
        const groundMat = new THREE.MeshStandardMaterial({ color: 0x1e293b, roughness: 0.8 });
        const ground = new THREE.Mesh(groundGeo, groundMat);
        ground.rotation.x = -Math.PI / 2;
        ground.receiveShadow = true;
        scene.add(ground);

        // Parking Slots Group
        const slotsGroup = new THREE.Group();
        scene.add(slotsGroup);
        const slotMeshes = [];

        const slotWidth = 8;
        const slotDepth = 15;
        const cols = 6;
        const rows = [
            { type: 'ev', color: 0x10b981, z: -30 },
            { type: 'normal', color: 0x2563eb, z: -10 },
            { type: 'normal', color: 0x2563eb, z: 15 },
            { type: 'ev', color: 0x10b981, z: 35 }
        ];

        let availableCount = 0;
        let evCount = 0;

        rows.forEach((row, rIdx) => {
            for (let c = 0; c < cols; c++) {
                const x = (c - (cols - 1) / 2) * (slotWidth + 3);
                const z = row.z;
                const slotId = `${String.fromCharCode(65 + rIdx)}${c < 9 ? '0' + (c + 1) : c + 1}`;
                const isOccupied = (c === 1 || c === 4) && rIdx !== 0;

                const slotGeo = new THREE.BoxGeometry(slotWidth, 0.4, slotDepth);
                const slotMat = new THREE.MeshStandardMaterial({
                    color: isOccupied ? 0x475569 : row.color,
                    roughness: 0.4,
                    metalness: 0.2
                });
                const slotMesh = new THREE.Mesh(slotGeo, slotMat);
                slotMesh.position.set(x, 0.2, z);
                slotMesh.receiveShadow = true;
                slotMesh.userData = {
                    slotNumber: slotId,
                    type: row.type,
                    available: !isOccupied
                };

                slotsGroup.add(slotMesh);
                slotMeshes.push(slotMesh);

                if (!isOccupied) {
                    availableCount++;
                    if (row.type === 'ev') evCount++;
                }

                // If occupied, add 3D car box model
                if (isOccupied) {
                    const carGeo = new THREE.BoxGeometry(slotWidth * 0.7, 3.5, slotDepth * 0.7);
                    const carMat = new THREE.MeshStandardMaterial({ color: 0xef4444, metalness: 0.5, roughness: 0.3 });
                    const carMesh = new THREE.Mesh(carGeo, carMat);
                    carMesh.position.set(x, 2, z);
                    carMesh.castShadow = true;
                    slotsGroup.add(carMesh);
                }
            }
        });

        document.getElementById('available-slots').innerText = availableCount;
        document.getElementById('ev-slots').innerText = evCount;

        // Raycasting for interactive click
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();

        function onClick(event) {
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
            raycaster.setFromCamera(mouse, camera);

            const intersects = raycaster.intersectObjects(slotMeshes);
            if (intersects.length > 0) {
                const hit = intersects[0].object;
                if (!hit.userData.available) {
                    API.toast(`Slot ${hit.userData.slotNumber} is occupied!`, 'warning');
                    return;
                }
                const isEv = hit.userData.type === 'ev';
                API.toast(`Selected Slot ${hit.userData.slotNumber}. Redirecting to booking...`, 'success');
                setTimeout(() => {
                    window.location.href = `/booking.html?locationId=1&slotNumber=${hit.userData.slotNumber}&isEv=${isEv}`;
                }, 600);
            }
        }

        window.addEventListener('click', onClick);

        // Resize
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            labelRenderer.setSize(window.innerWidth, window.innerHeight);
        });

        document.getElementById('resetView').addEventListener('click', () => {
            camera.position.set(0, 75, 120);
            controls.target.set(0, 0, 0);
        });

        // Hide loading
        setTimeout(() => {
            document.getElementById('loading').style.display = 'none';
        }, 600);

        // Animation Loop
        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
            labelRenderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>
