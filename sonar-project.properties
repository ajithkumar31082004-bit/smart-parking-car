# SonarQube / SonarCloud project configuration for SmartPark AI
sonar.projectKey=smartpark-ai
sonar.projectName=SmartPark AI
sonar.projectVersion=2.0.0

# Source paths
sonar.sources=backend/src,frontend/js,ml
sonar.tests=tests

# Exclusions
sonar.exclusions=node_modules/**,ml/__pycache__/**,database/smartpark.db,frontend/css/**,docs/**

# Language settings
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Encoding
sonar.sourceEncoding=UTF-8
