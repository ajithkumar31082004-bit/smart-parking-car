global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'smartpark-app'
    metrics_path: '/api/health' # Or /metrics if express-prom-client is added
    scrape_interval: 10s
    static_configs:
      - targets: ['smartpark-app:5000']
