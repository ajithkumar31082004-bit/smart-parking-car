<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In | SmartPark AI Platform</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap">
    <link rel="stylesheet" href="/frontend/css/styles.css">
    <style>
        .auth-card {
            background: var(--bg-surface);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            padding: 2.5rem;
            max-width: 480px;
            margin: 2rem auto;
            box-shadow: var(--shadow-lg);
        }
        .demo-roles-strip {
            background: var(--bg-body);
            padding: 1rem;
            border-radius: var(--radius-md);
            margin-top: 1.5rem;
            border: 1px dashed var(--border-color);
        }
    </style>
</head>
<body>
    <!-- Header -->
    <header class="app-header">
        <div class="header-container">
            <a href="/index.html" class="brand-logo">
                <i class="fas fa-car-side"></i>
                <span>SmartPark<span style="color:var(--text-main)">AI</span></span>
            </a>
            <nav class="nav-links" id="dynamic-nav-links"></nav>
            <div class="nav-actions">
                <button class="theme-btn" onclick="toggleTheme()" title="Toggle Theme"><i class="fas fa-moon theme-icon"></i></button>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="main-wrapper">
        <div class="auth-card">
            <div style="text-align: center; margin-bottom: 2rem;">
                <div style="width: 50px; height: 50px; background: var(--primary-light); color: var(--primary); border-radius: var(--radius-md); display: inline-flex; align-items: center; justify-content: center; font-size: 1.5rem; margin-bottom: 0.75rem;">
                    <i class="fas fa-user-lock"></i>
                </div>
                <h1 style="font-size: 1.8rem; font-weight: 800;">Welcome Back</h1>
                <p style="color: var(--text-muted); font-size: 0.9rem;">Sign in to access your digital parking passes and fleet management.</p>
            </div>

            <form id="loginForm" onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label class="form-label">Email Address</label>
                    <input type="email" id="email" class="form-control" placeholder="name@domain.com" required value="customer@smartpark.ai">
                </div>

                <div class="form-group">
                    <div style="display:flex; justify-content:space-between;">
                        <label class="form-label">Password</label>
                        <a href="javascript:void(0)" onclick="alert('Demo reset instructions sent to email.')" style="font-size:0.8rem;">Forgot password?</a>
                    </div>
                    <input type="password" id="password" class="form-control" placeholder="••••••••" required value="Password@123">
                </div>

                <button type="submit" id="loginBtn" class="btn btn-primary btn-lg" style="width: 100%; margin-top: 1rem;">
                    <i class="fas fa-sign-in-alt"></i> Sign In
                </button>
            </form>

            <div style="text-align: center; margin-top: 1.25rem; font-size: 0.9rem; color: var(--text-muted);">
                Don't have an account? <a href="/signup.html" style="font-weight: 600;">Create account</a>
            </div>

            <!-- Quick Demo Credentials for Fast Evaluation -->
            <div class="demo-roles-strip">
                <div style="font-size: 0.75rem; font-weight: 700; color: var(--text-muted); text-transform: uppercase; margin-bottom: 0.5rem;">
                    ⚡ 1-Click Demo Logins:
                </div>
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 0.4rem;">
                    <button type="button" onclick="fillDemo('customer@smartpark.ai', 'Password@123')" class="btn btn-secondary btn-sm" style="font-size:0.75rem;"><i class="fas fa-user"></i> Customer</button>
                    <button type="button" onclick="fillDemo('staff@smartpark.ai', 'Password@123')" class="btn btn-secondary btn-sm" style="font-size:0.75rem;"><i class="fas fa-qrcode"></i> Staff</button>
                    <button type="button" onclick="fillDemo('manager@smartpark.ai', 'Password@123')" class="btn btn-secondary btn-sm" style="font-size:0.75rem;"><i class="fas fa-user-tie"></i> Manager</button>
                    <button type="button" onclick="fillDemo('admin@smartpark.ai', 'Password@123')" class="btn btn-secondary btn-sm" style="font-size:0.75rem;"><i class="fas fa-shield-alt"></i> Admin</button>
                </div>
            </div>
        </div>
    </main>

    <!-- Scripts -->
    <script src="/frontend/js/theme.js"></script>
    <script src="/frontend/js/api.js"></script>
    <script src="/frontend/js/auth.js"></script>
    <script>
        function fillDemo(email, pass) {
            document.getElementById('email').value = email;
            document.getElementById('password').value = pass;
        }

        async function handleLogin(e) {
            e.preventDefault();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const btn = document.getElementById('loginBtn');

            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Authenticating...';

            try {
                const res = await API.login(email, password);
                if (res && res.token) {
                    Auth.login(res.token, res.user);
                    API.toast(`Welcome back, ${res.user.name}!`, 'success');

                    const urlParams = new URLSearchParams(window.location.search);
                    const redirect = urlParams.get('redirect');

                    setTimeout(() => {
                        if (redirect) {
                            window.location.href = redirect;
                        } else if (res.user.role === 'admin' || res.user.role === 'manager' || res.user.role === 'superadmin') {
                            window.location.href = '/admin.html';
                        } else if (res.user.role === 'staff') {
                            window.location.href = '/staff-scanner.html';
                        } else {
                            window.location.href = '/dashboard.html';
                        }
                    }, 500);
                }
            } catch (err) {
                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-sign-in-alt"></i> Sign In';
            }
        }
    </script>
</body>
</html>
